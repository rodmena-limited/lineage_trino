[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trino-lineage"
version = "1.0.0"
description = "Column-level lineage extraction for Trino SQL — parse, trace, render"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["trino", "lineage", "sql", "column-lineage", "data-governance"]
authors = [
    {name = "Farshid Ashouri", email = "farsheed.ashouri@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sqlglot>=25.0.0,<31",
    "graphviz>=0.20",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/rodmena-limited/lineage_trino"
Repository = "https://github.com/rodmena-limited/lineage_trino"
Issues = "https://github.com/rodmena-limited/lineage_trino/issues"

[project.scripts]
trino-lineage = "lineage_trino.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_trino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
